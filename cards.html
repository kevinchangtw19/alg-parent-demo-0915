<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>親子演算法對話卡</title>
<style>
:root{
  --bg:#F3EDE1; --surface:#FBF7F0; --line:#E2D6C0; --line-soft:#EFE7D8;
  --ink:#241F1A; --ink-2:#5F574C; --ink-3:#9A9084;
  --clay:#C97A45; --clay-deep:#A85D2E; --clay-tint:#FBEEE1; --clay-line:#EBD3B4;
  --moss:#4E8A62; --moss-deep:#3A6B4B; --moss-tint:#E7F0E7; --moss-line:#CDE0D2;
  --r-sm:10px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  --sh-1:0 2px 8px rgba(74,58,38,.07); --sh-2:0 8px 22px rgba(74,58,38,.12); --sh-3:0 20px 44px rgba(74,58,38,.22);
  --serif:"Noto Serif TC","Songti TC","Times New Roman",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --fs-body:16.5px;   /* 主要內容字級（手機基準） */
  --fs-title:23px;
  --deck-w:236px; --deck-h:322px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 60% at 50% -8%,#FDF1DF 0%,rgba(253,241,223,0) 60%),var(--bg);
  color:var(--ink);font-family:var(--sans);line-height:1.8;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
.app{max-width:520px;margin:0 auto;padding:18px 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}

/* ============ 平板：字級與牌疊放大 ============ */
@media(min-width:560px){
  :root{--fs-body:17.5px;--fs-title:25px;--deck-w:252px;--deck-h:344px}
}

/* ============ 桌機：自動套手機外框；可切寬版 ============ */
.viewtoggle{display:none}
@media(min-width:900px){
  .viewtoggle{
    display:block;position:fixed;top:16px;right:16px;z-index:60;
    border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
    padding:10px 18px;font:700 14px var(--sans);color:var(--ink);cursor:pointer;box-shadow:var(--sh-1)
  }
  body.framed{padding:30px 0}
  body.framed .app{
    max-width:430px;height:calc(100vh - 60px);min-height:0;overflow-y:auto;
    background:var(--surface);border-radius:46px;padding:30px 22px 26px;
    box-shadow:0 0 0 12px #2A2621, 0 30px 70px rgba(74,58,38,.32)
  }
  body.framed .app::-webkit-scrollbar{width:0}
  body.wide{padding:20px 0}
  body.wide .app{max-width:760px}
  body.wide{--fs-body:18px;--fs-title:27px}
  body.wide .list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  body.wide .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
}

/* ================= 首頁 ================= */
.head{text-align:center;padding:14px 4px 6px}
.head .kick{font-size:11px;font-weight:800;letter-spacing:.24em;color:var(--clay)}
.head h1{font-family:var(--serif);font-size:27px;line-height:1.35;margin:9px 0 6px;letter-spacing:.02em}
.head p{margin:0;font-size:14.5px;color:var(--ink-2)}
.cats{display:flex;flex-direction:column;gap:13px;margin-top:20px}
.cat{position:relative;display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);padding:0;overflow:hidden;cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  text-align:left;width:100%;font-family:inherit;color:inherit}
.cat:active{transform:scale(.985)}
.cat:hover{box-shadow:var(--sh-2)}
.cat .edge{width:10px;align-self:stretch;flex:none}
.cat .body{flex:1;padding:17px 4px 17px 0}
.cat .nm{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.4;display:block}
.cat .sub{font-size:13px;color:var(--ink-3);margin-top:1px;display:block}
.cat .cnt{flex:none;padding-right:17px;text-align:right}
.cat .cnt b{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--clay-deep);line-height:1;display:block}
.cat .cnt span{display:block;font-size:11px;color:var(--ink-3);margin-top:3px}
.tip{text-align:center;font-size:13px;color:var(--ink-3);margin-top:18px}
.allbtn{margin-top:14px;width:100%;border:1.5px dashed var(--clay-line);background:var(--clay-tint);
  border-radius:var(--r-lg);padding:15px;font:700 15.5px var(--sans);color:var(--clay-deep);cursor:pointer}
.allbtn:active{transform:scale(.99)}

/* ================= 共用頂列 ================= */
.bar2{display:flex;align-items:center;gap:10px;padding:4px 0 2px}
.back-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
  padding:8px 14px;font:700 13.5px var(--sans);color:var(--ink-2);cursor:pointer;flex:none}
.bar2 .ti{flex:1;text-align:center;min-width:0}
.bar2 .ti .n{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.3}
.bar2 .ti .c{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.06em}
.bar2 .sp{width:52px;flex:none}

/* 模式切換 */
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-pill);
  padding:3px;gap:2px;margin:12px auto 2px;width:fit-content}
.seg button{border:none;background:none;font:700 14px var(--sans);color:var(--ink-2);
  padding:9px 22px;border-radius:var(--r-pill);cursor:pointer;transition:.16s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--clay);color:#fff}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 0 8px;min-height:360px}

/* ================= 牌疊 ================= */
.deckwrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:10px 0}
.deck{position:relative;width:var(--deck-w);height:var(--deck-h);cursor:pointer}
.back{position:absolute;inset:0;border-radius:var(--r-xl);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 7px,rgba(0,0,0,0) 7px 14px),
    linear-gradient(150deg,var(--clay) 0%,#B4693C 45%,var(--moss) 100%);
  border:1px solid rgba(255,255,255,.22);box-shadow:0 7px 18px rgba(74,58,38,.20);
  display:flex;align-items:center;justify-content:center;will-change:transform;backface-visibility:hidden}
.back .mono{width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:31px;color:#fff;letter-spacing:.04em;background:rgba(255,255,255,.10)}
.back .cap{position:absolute;bottom:22px;left:0;right:0;text-align:center;
  font-size:11.5px;letter-spacing:.22em;color:rgba(255,255,255,.78);font-weight:700}
.back.fly{transition:transform 190ms var(--ease),opacity 190ms var(--ease);
  transform:translateY(-58px) scale(1.1) rotateY(90deg)!important;opacity:0}
.deckhint{font-size:14px;color:var(--ink-2);text-align:center}
.deckhint b{color:var(--clay-deep)}
.mini-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
  padding:9px 18px;font:700 13.5px var(--sans);color:var(--ink);cursor:pointer}
.mini-btn:active{transform:scale(.97)}

/* ================= 卡片 ================= */
.cardzone{width:100%;perspective:1100px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-3);overflow:hidden;transform-origin:50% 40%}
.card.in{animation:cardIn 200ms var(--ease) both}
.card.out{animation:cardOut 340ms var(--ease) both}
@keyframes cardIn{from{transform:rotateY(-90deg) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes cardOut{to{transform:translateY(120px) scale(.55);opacity:.22}}
.card .cbar{height:9px}
.card .pad{padding:18px 19px 22px}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.chip{font-size:11.5px;font-weight:800;border-radius:var(--r-pill);padding:3px 11px;border:1px solid}
.cid{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.lvl{font-size:11px;font-weight:800;border-radius:var(--r-pill);padding:3px 10px;border:1px solid}
.lvl.高{background:#FBEEDA;color:#8A6414;border-color:#EEDDB4}
.lvl.中{background:var(--moss-tint);color:var(--moss-deep);border-color:var(--moss-line)}
.lvl.低{background:#F1EBE0;color:#7A7064;border-color:var(--line)}
.card h2{font-family:var(--serif);font-size:var(--fs-title);line-height:1.45;margin:0 0 13px;letter-spacing:.02em}
.algo{font-size:var(--fs-body);line-height:1.8;white-space:pre-wrap;color:var(--ink)}
details{margin-top:13px;border-top:1px solid var(--line-soft);padding-top:11px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;
  font-size:14px;font-weight:700;color:var(--clay-deep);padding:3px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋";font-family:var(--mono);font-size:13px;width:19px;height:19px;flex:none;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--clay-tint);border:1px solid var(--clay-line);color:var(--clay-deep)}
details[open] summary::before{content:"－"}
.sub{font-size:15.5px;line-height:1.8;white-space:pre-wrap;color:var(--ink-2);margin-top:9px;
  background:var(--clay-tint);border:1px solid var(--clay-line);border-radius:var(--r-md);padding:12px 14px}
.sub.cite{background:#F4F0E7;border-color:var(--line);font-size:14.5px;color:#5F574C}
.actions{display:flex;gap:11px;margin-top:15px;padding-bottom:4px}
.actions button{flex:1;border-radius:var(--r-pill);padding:15px 10px;font:700 16px var(--sans);
  cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);transition:.16s var(--ease)}
.actions button:active{transform:scale(.975)}
.actions .go{background:var(--clay);border-color:var(--clay);color:#fff}
.actions .ok{background:var(--moss);border-color:var(--moss);color:#fff}

/* ================= 列表模式 ================= */
.list{display:flex;flex-direction:column;gap:10px;width:100%;padding:4px 0}
.li{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;cursor:pointer;width:100%;min-height:62px;
  text-align:left;font-family:inherit;color:inherit;transition:.16s var(--ease);box-shadow:var(--sh-1)}
.li:active{transform:scale(.99)}
.li:hover{box-shadow:var(--sh-2)}
.li .lb{width:7px;align-self:stretch;flex:none}
.li .lt{flex:1;padding:11px 12px;min-width:0}
.li .lid{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.li .lname{display:block;font-size:16px;font-weight:700;line-height:1.55;margin-top:1px}
.li .rt{flex:none;padding-right:12px;display:flex;align-items:center;gap:7px}
.li .tick{font-size:14px;color:var(--moss)}
.grp{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);
  margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp .gl{width:22px;height:4px;border-radius:9px;flex:none}
.grp:first-child{margin-top:4px}

/* ================= 完成／已看過 ================= */
.fin{text-align:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--sh-2);padding:32px 22px;width:100%}
.fin .ic{font-size:40px;line-height:1}
.fin h3{font-family:var(--serif);font-size:23px;margin:12px 0 7px}
.fin p{font-size:14.5px;color:var(--ink-2);margin:0 0 20px}
.fin .btns{display:flex;flex-direction:column;gap:10px}
.fin button{border-radius:var(--r-pill);padding:14px;font:700 15.5px var(--sans);cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.fin button.pri{background:var(--moss);border-color:var(--moss);color:#fff}
.seen{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.seen .lb2{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ink-3);margin-bottom:9px}
.strip{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{height:4px}
.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.scard{flex:none;width:126px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);overflow:hidden;cursor:pointer;opacity:.68;transition:.16s var(--ease)}
.scard:active{transform:scale(.97)}
.scard:hover{opacity:1;box-shadow:var(--sh-1)}
.scard .sb{height:5px}
.scard .sp2{padding:8px 10px 10px}
.scard .si{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.scard .sn{font-size:13px;font-weight:700;line-height:1.5;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.foot{text-align:center;font-size:11.5px;line-height:1.85;color:var(--ink-3);
  margin-top:22px;padding-top:14px;border-top:1px solid var(--line-soft)}
</style>
</head>
<body>
<button class="viewtoggle" id="vt">🖥 寬版閱讀</button>
<div class="app">

  <!-- ========== 首頁：主題選擇 ========== -->
  <section class="view on" id="v-home">
    <div class="head">
      <div class="kick">親子共學教具</div>
      <h1>親子演算法對話卡</h1>
      <p>抽一張，和孩子聊一件事。</p>
    </div>
    <div class="cats" id="cats"></div>
    <div class="tip">點選主題，開始抽卡。</div>
    <button class="allbtn" id="allBtn" type="button">☰ 全部展開　瀏覽全部 33 張</button>
  </section>

  <!-- ========== 主題頁：抽卡／列表 ========== -->
  <section class="view" id="v-deck">
    <div class="bar2">
      <button class="back-btn" id="toHome">← 主題</button>
      <div class="ti"><div class="n" id="dName"></div><div class="c" id="dCount"></div></div>
      <div class="sp"></div>
    </div>
    <div class="seg" id="seg">
      <button data-m="draw" aria-pressed="true">🂠 抽卡</button>
      <button data-m="list" aria-pressed="false">☰ 列表</button>
    </div>
    <div class="stage" id="stage"></div>
    <div id="seenBox"></div>
  </section>

  <!-- ========== 全部展開 ========== -->
  <section class="view" id="v-all">
    <div class="bar2">
      <button class="back-btn" id="allBack">← 主題</button>
      <div class="ti"><div class="n">全部卡片</div><div class="c" id="allCount"></div></div>
      <div class="sp"></div>
    </div>
    <div id="allBody"></div>
  </section>

  <div class="foot">
    本教具部分改編自美國兒科學會卓越中心之家庭社群媒體對話素材，其餘卡片為自行編寫；
    演算法改寫內容為自行編寫。
  </div>
</div>

<script>
/* ===== 卡片資料（沿用 親子演算法對話卡_原型v1.html 之 CARDS，內容未更動） ===== */

 {

  "algo": "提示：帶孩子看懂『為什麼停不下來』背後的演算法設計——不是你不自律，是它被設計成讓你一直滑。 「你覺得是誰決定你首頁下一支影片？（演算法）它靠自動播放、無限捲動讓你停不下來。什麼方法幫你按下停止？」 「我們一起找找看：TikTok/YouTube 裡有沒有『提醒休息』或『設定時間』的功能？找到就一起打開。」",

const CATS = [
  {key:'綠 Green',     short:'綠',  label:'界線與習慣', color:'#6E9E77', ink:'#4A7A52', tint:'#E8F1E9'},
  {key:'黃 Yellow',    short:'黃',  label:'安全技能',   color:'#E0A63F', ink:'#93691A', tint:'#FBF0DA'},
  {key:'紅 Red',       short:'紅',  label:'科技設定',   color:'#C2604C', ink:'#9B4433', tint:'#F9E7E2'},
  {key:'藍 Blue',      short:'藍',  label:'社交連結',   color:'#5B7FA3', ink:'#3F6183', tint:'#E6EDF4'},
  {key:'彩虹 Rainbow', short:'彩虹',label:'平臺設定',
   color:'linear-gradient(90deg,#C2604C,#E0A63F,#6E9E77,#5B7FA3,#8792C0)', ink:'#7A6B9E', tint:'#F0EDF6'}
];
const catOf = k => CATS.find(c=>c.key===k);
const byId  = id => CARDS.find(c=>c.id===id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===== 狀態 ===== */
let S = {cat:null, order:[], pos:0, seen:[], active:null, review:false,
         mode:'draw', ctx:'deck', wide:false};
function save(){ try{ sessionStorage.setItem('drawdeck2', JSON.stringify(S)); }catch(e){} }
function load(){ try{ const d=JSON.parse(sessionStorage.getItem('drawdeck2')||'null'); if(d) S=Object.assign(S,d); }catch(e){} }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===== 桌機／手機比例 ===== */
const vt=document.getElementById('vt');
function applyFrame(){
  const wide=window.matchMedia('(min-width:900px)').matches;
  document.body.classList.toggle('framed', wide && !S.wide);
  document.body.classList.toggle('wide',   wide &&  S.wide);
  vt.textContent = S.wide ? '📱 手機檢視' : '🖥 寬版閱讀';
}
vt.onclick=()=>{ S.wide=!S.wide; save(); applyFrame(); };
window.addEventListener('resize', applyFrame);

/* ===== 首頁 ===== */
function renderHome(){
  const box=document.getElementById('cats'); box.innerHTML='';
  CATS.forEach(c=>{
    const n=CARDS.filter(x=>x.cat===c.key).length;
    const b=document.createElement('button'); b.className='cat'; b.type='button';
    b.innerHTML='<span class="edge" style="background:'+c.color+'"></span>'+
      '<span class="body"><span class="nm">'+esc(c.label)+'</span>'+
      '<span class="sub">'+esc(c.short)+'　'+esc(c.key.split(' ')[1])+'</span></span>'+
      '<span class="cnt"><b>'+n+'</b><span>張</span></span>';
    b.onclick=()=>openCat(c.key);
    box.appendChild(b);
  });
}
function show(id){
  ['v-home','v-deck','v-all'].forEach(v=>{
    document.getElementById(v).classList.toggle('on', v===id);
  });
  window.scrollTo(0,0);
  const app=document.querySelector('.app'); if(app) app.scrollTop=0;
}
function toHome(){ S.cat=null; S.active=null; S.ctx='deck'; save(); show('v-home'); }
document.getElementById('toHome').onclick=toHome;
document.getElementById('allBack').onclick=toHome;

/* ===== 進入主題 ===== */
function openCat(key){
  S.cat=key;
  S.order=shuffled(CARDS.filter(c=>c.cat===key).map(c=>c.id));
  S.pos=0; S.seen=[]; S.active=null; S.review=false; S.ctx='deck';
  save(); show('v-deck'); syncSeg(); renderDeck(S.mode==='draw');
}
function syncSeg(){
  Array.prototype.forEach.call(document.getElementById('seg').children,b=>{
    b.setAttribute('aria-pressed', b.dataset.m===S.mode);
  });
}
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  S.mode=b.dataset.m; S.active=null; S.review=false; save(); syncSeg();
  renderDeck(S.mode==='draw');
});

/* ===== 主題頁 ===== */
function stackT(i,n){
  const d=n-1-i;
  return 'translate('+(d*1.7)+'px,'+(d*2.5)+'px) rotate('+((d%2?-1:1)*d*0.7)+'deg)';
}
function renderDeck(autoShuffle){
  const c=catOf(S.cat), M=S.order.length;
  document.getElementById('dName').textContent=c.label;
  document.getElementById('dCount').textContent='已抽 '+S.pos+' / 共 '+M;
  const stage=document.getElementById('stage'); stage.innerHTML='';
  document.getElementById('seg').style.display = S.active ? 'none' : '';

  if(S.active){ stage.appendChild(buildCard(byId(S.active))); renderSeen(false); return; }

  /* --- 列表模式 --- */
  if(S.mode==='list'){
    stage.style.justifyContent='flex-start';
    const wrap=document.createElement('div'); wrap.className='list';
    S.order.forEach((id,i)=>{
      wrap.appendChild(listRow(byId(id), i<S.pos));
    });
    stage.appendChild(wrap); renderSeen(true); return;
  }
  stage.style.justifyContent='center';

  /* --- 抽完 --- */
  if(S.pos>=M){
    const f=document.createElement('div'); f.className='fin';
    f.innerHTML='<div class="ic">🎉</div><h3>這個主題聊完了</h3>'+
      '<p>「'+esc(c.label)+'」的 '+M+' 張都抽過了。</p>'+
      '<div class="btns"><button class="pri" id="again">重新洗牌再來一輪</button>'+
      '<button id="other">換一個主題</button></div>';
    stage.appendChild(f);
    f.querySelector('#again').onclick=()=>openCat(S.cat);
    f.querySelector('#other').onclick=toHome;
    renderSeen(true); return;
  }

  /* --- 牌疊 --- */
  const wrap=document.createElement('div'); wrap.className='deckwrap';
  const deck=document.createElement('div'); deck.className='deck'; deck.id='deck';
  const remain=M-S.pos, vis=Math.min(remain,7);
  for(let i=0;i<vis;i++){
    const b=document.createElement('div'); b.className='back';
    b.style.transform=stackT(i,vis); b.style.zIndex=String(i);
    if(i===vis-1) b.innerHTML='<div class="mono">演</div><div class="cap">親子演算法對話卡</div>';
    deck.appendChild(b);
  }
  deck.onclick=drawCard; wrap.appendChild(deck);
  const hint=document.createElement('div'); hint.className='deckhint';
  hint.innerHTML='點一下牌疊抽卡　·　還有 <b>'+remain+'</b> 張';
  wrap.appendChild(hint);
  const sh=document.createElement('button'); sh.className='mini-btn'; sh.type='button';
  sh.textContent='↺ 重新洗牌';
  sh.onclick=e=>{ e.stopPropagation(); reshuffle(); };
  wrap.appendChild(sh);
  stage.appendChild(wrap);
  renderSeen(true);
  if(autoShuffle) setTimeout(doShuffle,60);
}

function listRow(card, drawn){
  const c=catOf(card.cat);
  const b=document.createElement('button'); b.className='li'; b.type='button';
  b.innerHTML='<span class="lb" style="background:'+c.color+'"></span>'+
    '<span class="lt"><span class="lid">'+esc(card.id)+'</span>'+
    '<span class="lname">'+esc(card.tzh)+'</span></span>'+
    '<span class="rt">'+(drawn?'<span class="tick">✓</span>':'')+
    '<span class="lvl '+esc(card.lvl)+'">'+esc(card.lvl)+'</span></span>';
  b.onclick=()=>{ S.active=card.id; S.review=true; save();
    if(S.ctx==='all') renderAll(); else renderDeck(false);
    window.scrollTo(0,0); const app=document.querySelector('.app'); if(app) app.scrollTop=0; };
  return b;
}

/* 洗牌：散開 → 收攏，共約 700ms */
function doShuffle(){
  const deck=document.getElementById('deck'); if(!deck) return;
  const backs=Array.prototype.slice.call(deck.querySelectorAll('.back')), n=backs.length;
  backs.forEach(b=>{
    b.style.transition='transform 330ms cubic-bezier(.2,.7,.2,1)';
    const dx=(Math.random()*2-1)*66, dy=(Math.random()*2-1)*42, r=(Math.random()*2-1)*20;
    b.style.transform='translate('+dx+'px,'+dy+'px) rotate('+r+'deg)';
  });
  setTimeout(()=>backs.forEach((b,i)=>{b.style.transform=stackT(i,n);}),350);
  setTimeout(()=>backs.forEach(b=>{b.style.transition='';}),700);
}
function reshuffle(){
  S.order=S.order.slice(0,S.pos).concat(shuffled(S.order.slice(S.pos)));
  save(); doShuffle();
}
function drawCard(){
  if(S.active || S.pos>=S.order.length) return;
  const deck=document.getElementById('deck'), top=deck&&deck.lastElementChild;
  if(top) top.classList.add('fly');
  setTimeout(()=>{ S.active=S.order[S.pos]; S.pos++; S.review=false; save(); renderDeck(false); },190);
}

/* ===== 卡片 ===== */
function buildCard(card){
  const c=catOf(card.cat);
  const zone=document.createElement('div'); zone.className='cardzone';
  const el=document.createElement('article'); el.className='card in';
  el.innerHTML=
    '<div class="cbar" style="background:'+c.color+'"></div><div class="pad">'+
      '<div class="meta">'+
        '<span class="chip" style="background:'+c.tint+';color:'+c.ink+';border-color:'+c.ink+'33">'+esc(c.short)+' · '+esc(c.label)+'</span>'+
        '<span class="cid">'+esc(card.id)+'</span>'+
        '<span class="lvl '+esc(card.lvl)+'">演算法相關 '+esc(card.lvl)+'</span>'+
      '</div>'+
      '<h2>'+esc(card.tzh)+'</h2>'+
      '<div class="algo">'+esc(card.algo)+'</div>'+
      '<details><summary>原卡版本</summary><div class="sub">'+esc(card.zh)+'</div></details>'+
      
    '</div>';
  zone.appendChild(el);

  const act=document.createElement('div'); act.className='actions';
  const close=()=>{ S.active=null; S.review=false; save();
    if(S.ctx==='all') renderAll(); else renderDeck(false); };
  if(S.review){
    const b1=document.createElement('button'); b1.type='button'; b1.className='ok'; b1.textContent='關閉';
    b1.onclick=close; act.appendChild(b1);
    if(S.ctx==='deck' && S.mode==='draw' && S.pos<S.order.length){
      const b2=document.createElement('button'); b2.type='button'; b2.className='go'; b2.textContent='繼續抽卡 →';
      b2.onclick=()=>{ close(); setTimeout(drawCard,40); }; act.appendChild(b2);
    }
  }else{
    const b1=document.createElement('button'); b1.type='button'; b1.className='ok'; b1.textContent='聊過了';
    b1.onclick=()=>dismiss(false);
    const b2=document.createElement('button'); b2.type='button'; b2.className='go'; b2.textContent='下一張 →';
    b2.onclick=()=>dismiss(true);
    act.appendChild(b1); act.appendChild(b2);
  }
  zone.appendChild(act);
  return zone;
}
function dismiss(thenDraw){
  const el=document.querySelector('.card'); if(!el) return;
  const id=S.active;
  el.classList.remove('in'); el.classList.add('out');
  const a=document.querySelector('.actions'); if(a) a.style.visibility='hidden';
  setTimeout(()=>{
    if(S.seen.indexOf(id)<0) S.seen.push(id);
    S.active=null; S.review=false; save(); renderDeck(false);
    if(thenDraw && S.pos<S.order.length) setTimeout(drawCard,40);
  },340);
}
function renderSeen(show2){
  const box=document.getElementById('seenBox'); box.innerHTML='';
  if(!show2 || !S.seen.length || S.mode==='list') return;
  const d=document.createElement('div'); d.className='seen';
  d.innerHTML='<div class="lb2">已看過（'+S.seen.length+'）　點卡片可重看</div>';
  const strip=document.createElement('div'); strip.className='strip';
  S.seen.forEach(id=>{
    const card=byId(id), c=catOf(card.cat);
    const s=document.createElement('div'); s.className='scard';
    s.innerHTML='<div class="sb" style="background:'+c.color+'"></div><div class="sp2">'+
      '<div class="si">'+esc(card.id)+'</div><div class="sn">'+esc(card.tzh)+'</div></div>';
    s.onclick=()=>{ S.active=id; S.review=true; save(); renderDeck(false); window.scrollTo(0,0); };
    strip.appendChild(s);
  });
  d.appendChild(strip); box.appendChild(d);
}

/* ===== 全部展開 ===== */
document.getElementById('allBtn').onclick=()=>{
  S.ctx='all'; S.active=null; S.review=false; save(); show('v-all'); renderAll();
};
function renderAll(){
  document.getElementById('allCount').textContent='共 '+CARDS.length+' 張　依主題排列';
  const box=document.getElementById('allBody'); box.innerHTML='';
  if(S.active){ box.appendChild(buildCard(byId(S.active))); return; }
  CATS.forEach(c=>{
    const cards=CARDS.filter(x=>x.cat===c.key);
    if(!cards.length) return;
    const h=document.createElement('div'); h.className='grp';
    h.innerHTML='<span class="gl" style="background:'+c.color+'"></span>'+
      esc(c.label)+'　'+cards.length+' 張';
    box.appendChild(h);
    const l=document.createElement('div'); l.className='list';
    cards.forEach(cd=>l.appendChild(listRow(cd,false)));
    box.appendChild(l);
  });
}

/* ===== 啟動 ===== */
load(); applyFrame(); renderHome(); syncSeg();
if(S.ctx==='all'){ show('v-all'); renderAll(); }
else if(S.cat && catOf(S.cat)){ show('v-deck'); renderDeck(false); }
</script>
